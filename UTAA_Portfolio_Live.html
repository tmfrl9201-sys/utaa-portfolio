<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTAA 포트폴리오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--utaa:#A8C800;--utaa-d:#7a9200;--bg:#fff;--bg2:#f7f7f5;--bg3:#f0f0ec;--tx:#1a1a1a;--tx2:#666;--tx3:#aaa;--br:rgba(0,0,0,0.12);--br2:rgba(0,0,0,0.22);--r:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;--tx:#f0f0ee;--tx2:#aaa;--tx3:#666;--br:rgba(255,255,255,0.12);--br2:rgba(255,255,255,0.22)}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg3);color:var(--tx);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px}
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 16px;background:var(--bg2);border-radius:var(--r);border:0.5px solid var(--br);flex-wrap:wrap}
.logo-img{height:24px;width:auto}
.divider{width:1px;height:20px;background:var(--br);flex-shrink:0}
.top-bar input{font-size:13px;border:none;background:transparent;color:var(--tx);outline:none;min-width:80px}
.top-bar input.office{flex:1}
.top-bar input.date{width:160px}
.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar input[type=text],.toolbar select{font-size:12px;padding:5px 9px;height:32px;border-radius:var(--r);border:0.5px solid var(--br2);background:var(--bg);color:var(--tx)}
.toolbar input[type=text]{width:148px}
.toolbar select{min-width:100px}
.sp{flex:1}
.btn{font-size:12px;padding:0 12px;height:32px;border-radius:var(--r);border:0.5px solid var(--br2);background:var(--bg);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--utaa);color:#fff;border-color:var(--utaa)}
.btn.pri:hover{background:var(--utaa-d)}
.btn.gh{border-color:var(--br);color:var(--tx2)}
.btn.gh:hover{background:var(--bg2);color:var(--tx)}
.btn.dn{color:#c0392b}
.btn.dn:hover{background:#fff0ee}
.btn.von{background:var(--bg2);border-color:var(--br2)}
.btn.sel-active{background:var(--utaa);color:#fff;border-color:var(--utaa)}
.sortrow{display:flex;gap:5px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sortrow span{font-size:11px;color:var(--tx2)}
.sb{font-size:11px;padding:3px 9px;height:26px;border-radius:20px;border:0.5px solid var(--br);background:transparent;color:var(--tx2);cursor:pointer}
.sb.on{background:var(--utaa);color:#fff;border-color:var(--utaa)}
.cnt{font-size:11px;color:var(--tx2);margin-left:auto}
.sel-info{font-size:11px;color:var(--utaa);font-weight:500;margin-left:8px;display:none}
.sel-info.show{display:inline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px}
.card{background:var(--bg);border:0.5px solid var(--br);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s;position:relative}
.card:hover{border-color:var(--utaa)}
.card.checked{border-color:var(--utaa);border-width:2px}
.card-check{position:absolute;top:8px;right:8px;z-index:10;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.9);border:1.5px solid var(--br2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all .15s}
.card.checked .card-check{background:var(--utaa);border-color:var(--utaa);color:#fff}
.cimg{width:100%;height:158px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative;cursor:pointer}
.cimg img{width:100%;height:100%;object-fit:cover}
.cimg span{font-size:11px;color:var(--tx3)}
.cyr{position:absolute;top:8px;left:8px;background:var(--utaa);color:#fff;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.cbody{padding:11px 13px;flex:1;display:flex;flex-direction:column;gap:3px}
.ctitle{font-size:14px;font-weight:500;color:var(--tx);cursor:pointer}
.cuse{font-size:11px;color:var(--tx2)}
.cinfo{font-size:11px;color:var(--tx2);line-height:1.85;margin-top:2px}
.cinfo span{display:block}
.cfoot{display:flex;gap:5px;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--br)}
.lw{display:flex;flex-direction:column;background:var(--bg);border-radius:var(--rl);overflow:hidden;border:0.5px solid var(--br)}
.li{display:flex;align-items:center;border-bottom:0.5px solid var(--br);transition:background .1s;position:relative}
.li:last-child{border-bottom:none}
.li:hover{background:var(--bg2)}
.li.checked{background:#f5fce6;border-left:3px solid var(--utaa)}
.li-check{width:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;height:54px;flex-shrink:0;font-size:16px;color:var(--br2)}
.li.checked .li-check{color:var(--utaa)}
.lth{width:78px;height:54px;flex-shrink:0;overflow:hidden;background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.lth img{width:100%;height:100%;object-fit:cover}
.lth span{font-size:10px;color:var(--tx3)}
.lyr{width:42px;flex-shrink:0;font-size:11px;color:var(--utaa);font-weight:500;padding:0 10px}
.lnm{flex:1;font-size:13px;font-weight:500;color:var(--tx);padding:0 8px;cursor:pointer}
.luse{width:60px;font-size:11px;color:var(--tx2);flex-shrink:0}
.lar{width:88px;font-size:11px;color:var(--tx2);flex-shrink:0}
.lloc{width:115px;font-size:11px;color:var(--tx2);flex-shrink:0;padding-right:6px}
.lact{display:flex;gap:4px;flex-shrink:0;padding:0 8px}
.lhead{display:flex;align-items:center;font-size:10px;color:var(--tx3);padding:5px 0;border-bottom:0.5px solid var(--br2);background:var(--bg2)}
.empty{text-align:center;padding:60px 0;color:var(--tx2);font-size:13px;background:var(--bg);border-radius:var(--rl)}
.toast{position:fixed;bottom:24px;right:24px;background:#222;color:#fff;font-size:12px;padding:9px 16px;border-radius:var(--r);z-index:999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.sync-bar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx2);margin-bottom:10px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0}
.sync-dot.ok{background:var(--utaa)}
.sync-dot.err{background:#e74c3c}
.sync-dot.loading{background:#f39c12;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:200;align-items:center;justify-content:center}
.ovl.open{display:flex}
.modal{background:var(--bg);border-radius:var(--rl);border:0.5px solid var(--br2);padding:22px;width:560px;max-width:96vw;max-height:92vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal h3{font-size:15px;font-weight:500;margin-bottom:16px;color:var(--tx)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fld label{font-size:11px;color:var(--tx2)}
.fld input,.fld select,.fld textarea{font-size:13px;padding:7px 9px;border-radius:var(--r);border:0.5px solid var(--br2);background:var(--bg);color:var(--tx);width:100%}
.fld textarea{min-height:68px;resize:vertical;line-height:1.6}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.df{width:100%;height:218px;background:var(--bg2);border-radius:var(--r);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.df img{width:100%;height:100%;object-fit:cover}
.df span{font-size:13px;color:var(--tx3)}
.dr{display:grid;grid-template-columns:70px 1fr;gap:3px 0;font-size:13px;margin-bottom:12px}
.dl{color:var(--tx2);font-size:12px}
.dv{color:var(--tx);font-weight:500}
.dd{font-size:13px;color:var(--tx2);line-height:1.7;border-top:0.5px solid var(--br);padding-top:10px;margin-top:4px}
.inote{font-size:12px;color:var(--tx2);line-height:1.7;margin-bottom:12px;padding:10px 12px;background:var(--bg2);border-radius:var(--r)}
.inote code{font-family:monospace;font-size:11px;background:var(--bg3);padding:1px 5px;border-radius:4px}
.dz{border:1.5px dashed var(--br2);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;font-size:13px;color:var(--tx2);transition:background .15s}
.dz:hover,.dz.drag{background:var(--bg2)}

/* Print CSS */
@media print{
  body{background:#fff}
  .wrap>*:not(#pArea){display:none!important}
  #pArea{display:block!important}
  @page{size:A4 landscape;margin:0}
}
#pArea{display:none}

/* Cover */
.pc{width:297mm;height:210mm;display:flex;flex-direction:column;justify-content:center;padding:50px 60px;page-break-after:always;background:#fff;overflow:hidden;box-sizing:border-box}
.pc img.plogo{height:52px;width:auto;object-fit:contain;margin-bottom:16px}
.pc .po{font-size:13px;color:#555;margin-top:5px}
.pc .pd{font-size:11px;color:#999;margin-top:4px}

/* Intro/Award page */
.pa{width:297mm;height:210mm;padding:44px 50px;page-break-after:always;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.pa .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:10px;border-bottom:0.5px solid #ddd;flex-shrink:0}
.pa .ph img{height:14px;width:auto;object-fit:contain}
.pa .ph span{font-size:10px;color:#aaa}
.pa-intro{font-size:12px;color:#333;line-height:1.9;margin-bottom:20px;flex-shrink:0}
.pa-award-title{font-size:10px;font-weight:600;color:#999;letter-spacing:0.1em;margin-bottom:8px;text-transform:uppercase;flex-shrink:0}
.pa-awards-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
.pa-award-row{display:flex;gap:20px;font-size:11px;color:#222;line-height:1.5;padding:2px 0;border-bottom:0.5px solid #f0f0f0}
.pa-yr{color:#A8C800;font-weight:600;min-width:32px;flex-shrink:0}
.pa-txt{flex:1}

/* Project page - left text, right image */
.pp{width:297mm;height:210mm;padding:0;page-break-after:always;page-break-inside:avoid;background:#fff;display:flex;flex-direction:row;overflow:hidden}
.pp .pp-left{width:200px;flex-shrink:0;padding:32px 24px 32px 36px;display:flex;flex-direction:column;border-right:0.5px solid #eee;overflow:hidden}
.pp .pp-right{flex:1;overflow:hidden;position:relative}
.pp .pp-right img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.pp .pp-right .pme{width:100%;height:100%;background:#f4f4f4;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:12px}
.pp .pp-hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;flex-shrink:0}
.pp .pp-hdr img{height:13px;width:auto;object-fit:contain}
.pp .pp-hdr span{font-size:9px;color:#bbb}
.pp .pyr{font-size:11px;color:#A8C800;font-weight:600;margin-top:14px;margin-bottom:4px;flex-shrink:0}
.pp .ptl{font-size:16px;font-weight:500;color:#111;letter-spacing:-0.01em;line-height:1.3;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.pp .paward{font-size:10px;font-weight:700;color:#111;margin-bottom:10px;line-height:1.4;flex-shrink:0}
.pp .psp{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:10px;margin-bottom:8px;flex-shrink:0}
.pp .sl{color:#888;white-space:nowrap}
.pp .sv{color:#111;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .sv.sv-team{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .pds{font-size:9px;color:#888;line-height:1.7;padding-top:8px;border-top:0.5px solid #eee;word-break:keep-all;overflow:hidden}
.pp .purl{font-size:9px;color:#aaa;margin-top:4px;word-break:break-all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp .pp-foot{margin-top:auto;padding-top:8px;border-top:0.5px solid #eee;flex-shrink:0}

/* Contact page */
.pcontact{width:297mm;height:210mm;padding:50px 60px;page-break-after:avoid;background:#fff;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.pcontact img.plogo{height:42px;width:auto;object-fit:contain;margin-bottom:12px}
.pcontact .pc-addr{font-size:12px;color:#555;margin-top:4px;line-height:1.8}
.pcontact .pc-info{font-size:12px;color:#555;margin-top:16px;line-height:2}
.pcontact .pc-rep{font-size:12px;color:#333;margin-top:12px}
</style>
</head>

  <div class="fld"><label>주소</label><input id="cAddr" placeholder="서울특별시 긴고랑로22길 26 도시다반사" value="서울특별시 긴고랑로22길 26 도시다반사"></div>
  <div class="fld"><label>웹사이트</label><input id="cWeb" placeholder="utaa.co.kr" value="utaa.co.kr"></div>
  <div class="fld"><label>이메일</label><input id="cEmail" placeholder="utaa_company@naver.com" value="utaa_company@naver.com"></div>
  <div class="fld"><label>전화</label><input id="cTel" placeholder="02.556.6903" value="02.556.6903"></div>
  <div class="fld"><label>대표자</label><input id="cRep" placeholder="010.3577.3577 _김창균 대표건축사" value="010.3577.3577 _김창균 대표건축사"></div>
  <div class="mfoot">
    <button class="btn" id="contactCloseBtn">닫기</button>
    <button class="btn pri" id="contactSaveBtn"><i class="ti ti-device-floppy"></i> 저장</button>
  </div>
</div>
</div>

<script>
var API = "https://script.google.com/macros/s/AKfycbz97Qrec7q8glBoBEi1mwlGUx96I2YnErI4nRGW93-vqHbMDqPurHkJMcHz3sBss5y0fw/exec";
var projects = [], editId = null, sortKey = "year", viewMode = "card";
var parsedRows = [], saving = false;
var selMode = false, selectedIds = [];

function syncState(s, msg) {
  document.getElementById("syncDot").className = "sync-dot " + s;
  document.getElementById("syncMsg").textContent = msg;
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2200);
}

function jsonp(url, cb) {
  var name = "cb_" + Date.now();
  window[name] = function(d) {
    delete window[name];
    document.getElementById("jsonpScript") && document.getElementById("jsonpScript").remove();
    cb(d);
  };
  var s = document.createElement("script");
  s.id = "jsonpScript";
  s.src = url + "&callback=" + name;
  s.onerror = function() {
    delete window[name];
    s.remove();
    cb(null);
  };
  document.head.appendChild(s);
}

function loadFromSheet() {
  syncState("loading", "구글 시트에서 불러오는 중...");
  jsonp(API + "?action=read", function(d) {
    if (!d) { syncState("err", "연결 실패 — 새로고침 버튼을 눌러주세요"); return; }
    if (d.projects) {
      projects = d.projects.map(function(p) {
        return {
          id: String(p.id || ""),
          name: String(p.name || ""),
          year: Number(p.year) || 0,
          use: String(p.use || ""),
          areaT: Number(p.areaT) || 0,
          areaS: Number(p.areaS) || 0,
          loc: String(p.loc || ""),
          floor: String(p.floor || ""),
          desc: String(p.desc || ""),
          img: String(p.img || ""),
          team: String(p.team || ""),
          contractor: String(p.contractor || ""),
          photo: String(p.photo || ""),
          award: String(p.award || ""),
          url: String(p.url || "")
        };
      });
      syncState("ok", projects.length + "개 프로젝트 · 구글 시트 연동됨");
      render();
    } else {
      syncState("err", "데이터 오류 — 새로고침 해보세요");
    }
  });
}

function pushToSheet(data, cb) {
  syncState("loading", "저장 중...");
  jsonp(API + "?action=save&data=" + encodeURIComponent(JSON.stringify(data)), function(d) {
    if (!d) { syncState("err", "저장 실패 — 네트워크 오류"); cb(false); return; }
    if (d.ok) { syncState("ok", "저장됨"); cb(true); }
    else { syncState("err", "저장 실패"); cb(false); }
  });
}

function deleteFromSheet(id, cb) {
  syncState("loading", "삭제 중...");
  jsonp(API + "?action=delete&id=" + id, function(d) {
    if (!d) { syncState("err", "삭제 실패"); cb(false); return; }
    if (d.ok) { syncState("ok", "삭제됨"); cb(true); }
    else { syncState("err", "삭제 실패"); cb(false); }
  });
}

function getFiltered() {
  var q = document.getElementById("srch").value.toLowerCase();
  var u = document.getElementById("fUse").value;
  var y = document.getElementById("fYear").value;
  var list = projects.filter(function(p) {
    if (q && p.name.toLowerCase().indexOf(q) < 0 && (p.loc || "").toLowerCase().indexOf(q) < 0) return false;
    if (u && p.use !== u) return false;
    if (y && String(p.year) !== y) return false;
    return true;
  });
  if (sortKey === "year") list.sort(function(a,b){return b.year-a.year;});
  else if (sortKey === "areaT") list.sort(function(a,b){return (b.areaT||0)-(a.areaT||0);});
  else if (sortKey === "areaS") list.sort(function(a,b){return (b.areaS||0)-(a.areaS||0);});
  else list.sort(function(a,b){return a.name.localeCompare(b.name,"ko");});
  return list;
}

function updateSelInfo() {
  var el = document.getElementById("selInfo");
  if (selMode && selectedIds.length > 0) {
    el.classList.add("show");
    el.textContent = selectedIds.length + "개 선택됨";
  } else {
    el.classList.remove("show");
  }
}

function toggleSelect(id) {
  var idx = selectedIds.indexOf(id);
  if (idx >= 0) selectedIds.splice(idx, 1);
  else selectedIds.push(id);
  updateSelInfo();
  render();
}

function render() {
  var list = getFiltered();
  var years = [];
  projects.forEach(function(p) { if (years.indexOf(p.year) < 0) years.push(p.year); });
  years.sort(function(a,b){return b-a;});
  var ySel = document.getElementById("fYear"), cy = ySel.value;
  ySel.innerHTML = "<option value=''>모든 연도</option>" + years.map(function(y) {
    return "<option" + (String(y)===cy?" selected":"") + ">" + y + "</option>";
  }).join("");
  document.getElementById("cnt").textContent = list.length + "개 프로젝트";
  var wrap = document.getElementById("mainWrap");
  if (!list.length) {
    wrap.innerHTML = "<div class='empty'><i class='ti ti-folder-off' style='font-size:26px;display:block;margin:0 auto 10px'></i>프로젝트가 없습니다. + 추가 버튼으로 입력하세요.</div>";
    return;
  }
  if (viewMode === "card") {
    wrap.innerHTML = "<div class='grid'>" + list.map(cardHTML).join("") + "</div>";
  } else {
    wrap.innerHTML = "<div class='lw'><div class='lhead'>" +
      (selMode ? "<div style='width:36px'></div>" : "") +
      "<div style='width:78px'></div><div class='lyr'>연도</div><div class='lnm' style='padding:0 8px'>프로젝트명</div><div class='luse'>용도</div><div class='lar'>연면적</div><div class='lloc'>위치</div><div style='width:90px'></div></div>" +
      list.map(listHTML).join("") + "</div>";
  }
}

function isSelected(id) { return selectedIds.indexOf(id) >= 0; }

function cardHTML(p) {
  var sel = isSelected(p.id);
  var imgEl = p.img ? "<img src='" + p.img + "' alt='" + p.name + "'>" : "<span>이미지 없음</span>";
  var checkEl = selMode ? "<div class='card-check' data-id='" + p.id + "'>" + (sel ? "✓" : "") + "</div>" : "";
  return "<div class='card" + (sel?" checked":"") + "' data-id='" + p.id + "'>" + checkEl +
    "<div class='cimg'>" + imgEl + "<span class='cyr'>" + p.year + "</span></div>" +
    "<div class='cbody'>" +
    "<div class='ctitle'>" + p.name + "</div>" +
    "<div class='cuse'>" + p.use + "</div>" +
    "<div class='cinfo'>" +
    (p.areaT ? "<span>연면적 " + p.areaT.toLocaleString() + "㎡</span>" : "") +
    (p.loc ? "<span>" + p.loc + "</span>" : "") +
    "</div>" +
    "<div class='cfoot'>" +
    "<button class='btn gh edit-btn' data-id='" + p.id + "' style='font-size:11px;height:25px;padding:0 9px'><i class='ti ti-edit'></i> 편집</button>" +
    "<button class='btn dn gh del-btn' data-id='" + p.id + "' style='font-size:11px;height:25px;padding:0 9px'><i class='ti ti-trash'></i></button>" +
    "</div></div></div>";
}

function listHTML(p) {
  var sel = isSelected(p.id);
  var imgEl = p.img ? "<img src='" + p.img + "' alt='" + p.name + "'>" : "<span style='font-size:10px;color:#aaa'>없음</span>";
  var checkEl = selMode ? "<div class='li-check' data-id='" + p.id + "'>" + (sel ? "✓" : "○") + "</div>" : "";
  return "<div class='li" + (sel?" checked":"") + "' data-id='" + p.id + "'>" + checkEl +
    "<div class='lth'>" + imgEl + "</div>" +
    "<div class='lyr'>" + p.year + "</div>" +
    "<div class='lnm'>" + p.name + "</div>" +
    "<div class='luse'>" + p.use + "</div>" +
    "<div class='lar'>" + (p.areaT ? p.areaT.toLocaleString()+"㎡" : "-") + "</div>" +
    "<div class='lloc'>" + (p.loc||"-") + "</div>" +
    "<div class='lact'>" +
    "<button class='btn gh edit-btn' data-id='" + p.id + "' style='font-size:11px;height:25px;padding:0 8px'><i class='ti ti-edit'></i></button>" +
    "<button class='btn dn gh del-btn' data-id='" + p.id + "' style='font-size:11px;height:25px;padding:0 8px'><i class='ti ti-trash'></i></button>" +
    "</div></div>";
}

function setView(v) {
  viewMode = v;
  document.getElementById("vCard").classList.toggle("von", v==="card");
  document.getElementById("vList").classList.toggle("von", v==="list");
  render();
}

function openAdd() {
  editId = null;
  document.getElementById("fmTitle").textContent = "새 프로젝트";
  ["fName","fYr","fAreaT","fAreaS","fLoc","fFloor","fTeam","fContractor","fPhoto","fAward","fDesc","fUrl","imgUrl"].forEach(function(i) {
    document.getElementById(i).value = "";
  });
  document.getElementById("fUse2").value = "";
  document.getElementById("fUse2Custom").style.display = "none";
  document.getElementById("fUse2Custom").value = "";
  openOvl("formOvl");
}

function openEdit(id) {
  var p = null;
  for (var i=0; i<projects.length; i++) { if (String(projects[i].id)===String(id)){p=projects[i];break;} }
  if (!p) return;
  editId = id;
  document.getElementById("fmTitle").textContent = "프로젝트 편집";
  document.getElementById("fName").value = p.name||"";
  document.getElementById("fYr").value = p.year||"";
  document.getElementById("fUse2").value = p.use||"";
  document.getElementById("fAreaT").value = p.areaT||"";
  document.getElementById("fAreaS").value = p.areaS||"";
  document.getElementById("fLoc").value = p.loc||"";
  document.getElementById("fFloor").value = p.floor||"";
  document.getElementById("fTeam").value = p.team||"";
  document.getElementById("fContractor").value = p.contractor||"";
  document.getElementById("fPhoto").value = p.photo||"";
  document.getElementById("fAward").value = p.award||"";
  document.getElementById("fDesc").value = p.desc||"";
  document.getElementById("fUrl").value = p.url||"";
  document.getElementById("imgUrl").value = p.img||"";
  document.getElementById("fUse2Custom").style.display = "none";
  openOvl("formOvl");
  closeOvl("detOvl");
}

function saveProj() {
  if (saving) return;
  var name = document.getElementById("fName").value.trim();
  var year = parseInt(document.getElementById("fYr").value);
  var use = document.getElementById("fUse2").value;
  if (use === "기타(직접입력)") use = document.getElementById("fUse2Custom").value.trim() || "기타";
  if (!name||!year||!use) { alert("프로젝트명, 연도, 용도는 필수입니다."); return; }
  saving = true;
  var data = {
    id: editId || String(Date.now()),
    name:name, year:year, use:use,
    areaT: parseFloat(document.getElementById("fAreaT").value)||0,
    areaS: parseFloat(document.getElementById("fAreaS").value)||0,
    loc: document.getElementById("fLoc").value.trim(),
    floor: document.getElementById("fFloor").value.trim(),
    team: document.getElementById("fTeam").value.trim(),
    contractor: document.getElementById("fContractor").value.trim(),
    photo: document.getElementById("fPhoto").value.trim(),
    award: document.getElementById("fAward").value.trim(),
    desc: document.getElementById("fDesc").value.trim(),
    url: document.getElementById("fUrl").value.trim(),
    img: document.getElementById("imgUrl").value.trim()
  };
  pushToSheet(data, function(ok) {
    saving = false;
    if (ok) {
      if (editId) { for(var i=0;i<projects.length;i++){if(String(projects[i].id)===String(editId)){projects[i]=data;break;}} }
      else projects.push(data);
      closeOvl("formOvl"); render();
      showToast(editId ? "수정됐어요!" : "추가됐어요!");
    }
  });
}

function delProject(id) {
  if (!confirm("이 프로젝트를 삭제할까요?")) return;
  deleteFromSheet(id, function(ok) {
    if (ok) {
      projects = projects.filter(function(x){return String(x.id)!==String(id);});
      selectedIds = selectedIds.filter(function(x){return x!==id;});
      render(); closeOvl("detOvl"); showToast("삭제됐어요");
    }
  });
}

function openDetail(id) {
  var p = null;
  for(var i=0;i<projects.length;i++){if(String(projects[i].id)===String(id)){p=projects[i];break;}}
  if (!p) return;
  document.getElementById("dImg").innerHTML = p.img ? "<img src='" + p.img + "' alt='" + p.name + "'>" : "<span>이미지 없음</span>";
  document.getElementById("dYr").textContent = p.year + "년";
  document.getElementById("dName").textContent = p.name;
  document.getElementById("dAward").textContent = p.award || "";
  var rows = [["용도",p.use]];
  if (p.loc) rows.push(["대지 위치",p.loc]);
  if (p.areaS) rows.push(["대지면적",p.areaS.toLocaleString()+"㎡"]);
  if (p.areaT) rows.push(["연면적",p.areaT.toLocaleString()+"㎡"]);
  if (p.floor) rows.push(["층수",p.floor]);
  if (p.team) rows.push(["설계팀",p.team]);
  if (p.contractor) rows.push(["시공사",p.contractor]);
  if (p.photo) rows.push(["사진촬영",p.photo]);
  document.getElementById("dRows").innerHTML = rows.map(function(r){return "<span class='dl'>"+r[0]+"</span><span class='dv'>"+r[1]+"</span>";}).join("");
  document.getElementById("dDesc").textContent = p.desc||"";
  document.getElementById("dEdit").setAttribute("data-id",id);
  document.getElementById("dDel").setAttribute("data-id",id);
  openOvl("detOvl");
}

function openOvl(id){document.getElementById(id).classList.add("open");}
function closeOvl(id){document.getElementById(id).classList.remove("open");}
document.querySelectorAll(".ovl").forEach(function(o){o.addEventListener("click",function(e){if(e.target===o)o.classList.remove("open");});});

// Toolbar events
document.getElementById("addBtn").addEventListener("click", openAdd);
document.getElementById("refreshBtn").addEventListener("click", loadFromSheet);
document.getElementById("saveBtn").addEventListener("click", saveProj);
document.getElementById("cancelBtn").addEventListener("click", function(){closeOvl("formOvl");});
document.getElementById("detCloseBtn").addEventListener("click", function(){closeOvl("detOvl");});
document.getElementById("dEdit").addEventListener("click", function(){openEdit(this.getAttribute("data-id"));});
document.getElementById("dDel").addEventListener("click", function(){delProject(this.getAttribute("data-id"));});
document.getElementById("vCard").addEventListener("click", function(){setView("card");});
document.getElementById("vList").addEventListener("click", function(){setView("list");});

document.getElementById("fUse2").addEventListener("change", function(){
  var c = document.getElementById("fUse2Custom");
  if (this.value==="기타(직접입력)"){c.style.display="block";c.focus();}
  else{c.style.display="none";c.value="";}
});

// Select mode
document.getElementById("selModeBtn").addEventListener("click", function(){
  selMode = !selMode;
  if (!selMode) selectedIds = [];
  this.classList.toggle("sel-active", selMode);
  this.innerHTML = selMode ? "<i class='ti ti-checkbox'></i> 선택해제" : "<i class='ti ti-checkbox'></i> 선택모드";
  updateSelInfo();
  render();
});

// Click delegation for main wrap
document.getElementById("mainWrap").addEventListener("click", function(e) {
  var checkBtn = e.target.closest(".card-check, .li-check");
  var editBtn = e.target.closest(".edit-btn");
  var delBtn = e.target.closest(".del-btn");
  var card = e.target.closest(".card, .li");
  if (checkBtn) { toggleSelect(checkBtn.getAttribute("data-id")); return; }
  if (delBtn) { delProject(delBtn.getAttribute("data-id")); return; }
  if (editBtn) { openEdit(editBtn.getAttribute("data-id")); return; }
  if (card && selMode) { toggleSelect(card.getAttribute("data-id")); return; }
  if (card && !selMode) { openDetail(card.getAttribute("data-id")); }
});

// Sort buttons
document.querySelectorAll(".sb").forEach(function(b){
  b.addEventListener("click",function(){
    sortKey=b.getAttribute("data-s");
    document.querySelectorAll(".sb").forEach(function(x){x.classList.remove("on");});
    b.classList.add("on"); render();
  });
});
["srch","fUse","fYear"].forEach(function(id){
  document.getElementById(id).addEventListener("input",render);
  document.getElementById(id).addEventListener("change",render);
});

// Award modal
document.getElementById("awardBtn").addEventListener("click",function(){
  document.getElementById("awardIntro").value=localStorage.getItem("utaa_intro")||"";
  document.getElementById("awardList").value=localStorage.getItem("utaa_awards")||"";
  openOvl("awardOvl");
});
document.getElementById("awardCloseBtn").addEventListener("click",function(){closeOvl("awardOvl");});
document.getElementById("awardSaveBtn").addEventListener("click",function(){
  localStorage.setItem("utaa_intro",document.getElementById("awardIntro").value);
  localStorage.setItem("utaa_awards",document.getElementById("awardList").value);
  closeOvl("awardOvl"); showToast("저장됐어요!");
});

// Contact modal
document.getElementById("contactBtn").addEventListener("click",function(){
  document.getElementById("cAddr").value=localStorage.getItem("utaa_addr")||"서울특별시 긴고랑로22길 26 도시다반사";
  document.getElementById("cWeb").value=localStorage.getItem("utaa_web")||"utaa.co.kr";
  document.getElementById("cEmail").value=localStorage.getItem("utaa_email")||"utaa_company@naver.com";
  document.getElementById("cTel").value=localStorage.getItem("utaa_tel")||"02.556.6903";
  document.getElementById("cRep").value=localStorage.getItem("utaa_rep")||"010.3577.3577 _김창균 대표건축사";
  openOvl("contactOvl");
});
document.getElementById("contactCloseBtn").addEventListener("click",function(){closeOvl("contactOvl");});
document.getElementById("contactSaveBtn").addEventListener("click",function(){
  ["addr","web","email","tel","rep"].forEach(function(k){
    localStorage.setItem("utaa_"+k,document.getElementById("c"+k.charAt(0).toUpperCase()+k.slice(1)).value);
  });
  closeOvl("contactOvl"); showToast("저장됐어요!");
});

// Print
document.getElementById("printBtn").addEventListener("click", function(){
  var printList;
  if (selMode && selectedIds.length > 0) {
    // 선택된 순서대로
    printList = selectedIds.map(function(id){
      for(var i=0;i<projects.length;i++){if(String(projects[i].id)===id)return projects[i];}
      return null;
    }).filter(Boolean);
  } else {
    printList = getFiltered();
  }

  var office = document.getElementById("officeName").value || "(주)유타건축사사무소";
  var printDate = document.getElementById("printDate").value || "";
  var logo = document.getElementById("logoImg").src;
  var intro = localStorage.getItem("utaa_intro")||"";
  var awards = localStorage.getItem("utaa_awards")||"";
  var addr = localStorage.getItem("utaa_addr")||"서울특별시 긴고랑로22길 26 도시다반사";
  var web = localStorage.getItem("utaa_web")||"utaa.co.kr";
  var email = localStorage.getItem("utaa_email")||"utaa_company@naver.com";
  var tel = localStorage.getItem("utaa_tel")||"02.556.6903";
  var rep = localStorage.getItem("utaa_rep")||"010.3577.3577 _김창균 대표건축사";

  var html = "";

  // 표지
  html += "<div class='pc'><img class='plogo' src='"+logo+"' alt='UTAA'><div class='po'>"+office+"</div>"+(printDate?"<div class='pd'>"+printDate+"</div>":"")+"</div>";

  // 소개/수상 페이지
  if (intro || awards) {
    html += "<div class='pa'><div class='ph'><img src='"+logo+"' alt='UTAA'><span>"+office+(printDate?" · "+printDate:"")+"</span></div>";
    if (intro) html += "<div class='pa-intro'>"+intro.replace(/
/g,"<br>")+"</div>";
    if (awards) {
      html += "<div class='pa-award-title'>수상경력</div>";
      html += "<div class='pa-awards-wrap'>";
      awards.split("
").filter(function(l){return l.trim();}).forEach(function(line){
        var parts = line.trim().split(" ");
        var yr = parts[0], rest = parts.slice(1).join(" ");
        html += "<div class='pa-award-row'><span class='pa-yr'>"+yr+"</span><span class='pa-txt'>"+rest+"</span></div>";
      });
      html += "</div>";
    }
    html += "</div>";
  }

  // 프로젝트 페이지 (좌: 텍스트, 우: 이미지)
  printList.forEach(function(p, i) {
    var specs = [];
    if (p.use) specs.push(["용도",p.use]);
    if (p.loc) specs.push(["대지위치",p.loc]);
    if (p.areaS) specs.push(["대지면적",p.areaS.toLocaleString()+"㎡"]);
    if (p.areaT) specs.push(["연면적",p.areaT.toLocaleString()+"㎡"]);
    if (p.floor) specs.push(["층수",p.floor]);
    if (p.team) specs.push(["설계팀",p.team]);
    if (p.contractor) specs.push(["시공사",p.contractor]);
    if (p.photo) specs.push(["사진촬영",p.photo]);

    html += "<div class='pp'>";
    html += "<div class='pp-left'>";
    html += "<div class='pp-hdr'><img src='"+logo+"' alt='UTAA'><span>"+(i+1)+" / "+printList.length+(printDate?" · "+printDate:"")+"</span></div>";
    html += "<div class='pyr'>"+p.year+"</div>";
    html += "<div class='ptl'>"+p.name+"</div>";
    if (p.award) html += "<div class='paward'>"+p.award+"</div>";
    html += "<div class='psp'>"+specs.map(function(s){
      var isTeam = s[0]==="설계팀";
      return "<span class='sl'>"+s[0]+"</span><span class='sv"+(isTeam?" sv-team":"")+"'>"+s[1]+"</span>";
    }).join("")+"</div>";
    if (p.desc || p.url) {
      html += "<div class='pp-foot'>";
      if (p.desc) html += "<div class='pds'>"+p.desc+"</div>";
      if (p.url) html += "<div class='purl'>"+p.url+"</div>";
      html += "</div>";
    }
    html += "</div>";
    html += "<div class='pp-right'>"+(p.img?"<img src='"+p.img+"' alt='"+p.name+"'>":"<div class='pme'>이미지 없음</div>")+"</div>";
    html += "</div>";
  });

  // 연락처 페이지
  html += "<div class='pcontact'><img class='plogo' src='"+logo+"' alt='UTAA'><div class='pc-addr'>"+addr+"</div><div class='pc-info'>"+web+"<br>"+email+"<br>"+tel+"</div><div class='pc-rep'>"+rep+"</div></div>";

  document.getElementById("pArea").innerHTML = html;
  setTimeout(function(){
    window.print();
    setTimeout(function(){document.getElementById("pArea").innerHTML="";},500);
  },100);
});

loadFromSheet();
setView("card");
</script>
</body>
</html>
