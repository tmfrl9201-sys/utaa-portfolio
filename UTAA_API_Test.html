<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>건축인허가 API 테스트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;color:#222;font-size:13px;padding:24px}
h2{font-size:16px;font-weight:700;margin-bottom:16px}
.card{background:#fff;border-radius:8px;border:1px solid #e0e0e0;padding:20px;margin-bottom:16px}
label{font-size:11px;font-weight:600;color:#666;display:block;margin-bottom:4px}
input{width:100%;font-size:12px;padding:7px 10px;border:1px solid #ddd;border-radius:6px;outline:none;margin-bottom:10px;font-family:inherit}
input:focus{border-color:#4caf50}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:9px 20px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:#4caf50;color:#fff;width:100%}
.btn-primary:hover{background:#388e3c}
.btn-secondary{background:#eee;color:#444}
pre{background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:6px;font-size:11px;overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all}
.result-item{padding:10px 12px;border-radius:6px;border:1px solid #e0e0e0;margin-bottom:8px;cursor:pointer;transition:all .15s}
.result-item:hover{border-color:#4caf50;background:#f9fff9}
.result-item h4{font-size:12px;font-weight:600;margin-bottom:4px}
.result-item p{font-size:11px;color:#666;line-height:1.8}
.hint{font-size:10px;color:#999;margin-top:-6px;margin-bottom:10px}
.field-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;padding:6px 0;border-bottom:1px solid #f0f0f0}
.field-row label{margin:0;min-width:110px;color:#999}
.field-row span{font-size:12px;color:#222;font-weight:500}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;background:#e8f5e9;color:#2e7d32;margin-left:6px}
</style>
</head>
<body>

<h2>🔍 건축인허가 API 테스트</h2>

<div class="card">
  <label>Apps Script URL</label>
  <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec" value="https://script.google.com/macros/s/AKfycbwvbaZ1YTsujkvzMc1Lj5VB5JjfBnx4U0CMTbZmCaIc9L93DXAPPyA7LKnZFipyRuWw0w/exec">

  <label style="margin-top:4px">조회 방식</label>
  <div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn-secondary" style="flex:1;border:2px solid #4caf50;color:#2e7d32" id="btnAddr" onclick="setMode('addr')">📍 주소로 조회</button>
    <button class="btn-secondary" style="flex:1" id="btnName" onclick="setMode('name')">🏢 건물명으로 조회</button>
  </div>

  <div id="addrMode" style="display:none">
    <div class="row">
      <div>
        <label>시군구코드 (5자리)</label>
        <input id="sigunguCd" placeholder="예: 11680 (강남구)">
        <div class="hint">서울 강남=11680, 종로=11110, 중구=11140</div>
      </div>
      <div>
        <label>법정동코드 (5자리)</label>
        <input id="bjdongCd" placeholder="예: 10300">
      </div>
    </div>
    <div class="row">
      <div><label>본번</label><input id="bun" placeholder="예: 0001"></div>
      <div><label>부번</label><input id="ji" placeholder="예: 0000"></div>
    </div>
  </div>

  <div id="nameMode">
    <label>건물명 <span style="font-weight:400;color:#999">(일부만 입력 가능)</span></label>
    <input id="bldNm" placeholder="예: 장지동992-7  또는  맘편한산부인과">
    <div class="row">
      <div>
        <label>시도명 <span style="font-weight:400;color:#999">(선택)</span></label>
        <input id="siNm" placeholder="예: 경기도, 서울특별시">
      </div>
      <div>
        <label>시군구명 <span style="font-weight:400;color:#999">(선택)</span></label>
        <input id="sggNm" placeholder="예: 화성시, 강남구">
      </div>
    </div>
    <div class="hint">💡 건물명이 없으면 지번(장지동992-7)으로도 검색 가능</div>
  </div>

  <button class="btn-primary" onclick="fetchAPI()" id="searchBtn">🔍 조회하기</button>
</div>

<div class="card" id="resultCard" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <h2 style="margin:0">조회 결과 <span id="resultCount" class="badge"></span></h2>
    <button class="btn-secondary" style="padding:4px 10px;font-size:11px" onclick="document.getElementById('resultCard').style.display='none'">닫기</button>
  </div>
  <div id="resultList"></div>
</div>

<div class="card" id="selectedCard" style="display:none">
  <h2 style="margin-bottom:12px">✅ 선택된 항목 — 앱에 적용될 데이터</h2>
  <div id="selectedFields"></div>
</div>

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <h2 style="margin:0">🔧 원본 응답</h2>
    <button class="btn-secondary" style="padding:4px 10px;font-size:11px" onclick="document.getElementById('rawOutput').textContent='(초기화)'">초기화</button>
  </div>
  <pre id="rawOutput">조회 결과가 여기 표시됩니다.</pre>
</div>

<script>
var currentMode = 'name';

function setMode(m) {
  currentMode = m;
  document.getElementById('addrMode').style.display = m==='addr' ? '' : 'none';
  document.getElementById('nameMode').style.display = m==='name' ? '' : 'none';
  document.getElementById('btnAddr').style.border = m==='addr' ? '2px solid #4caf50' : '';
  document.getElementById('btnAddr').style.color  = m==='addr' ? '#2e7d32' : '';
  document.getElementById('btnName').style.border = m==='name' ? '2px solid #4caf50' : '';
  document.getElementById('btnName').style.color  = m==='name' ? '#2e7d32' : '';
}

function fetchAPI() {
  var apiUrl = document.getElementById('apiUrl').value.trim();
  if(!apiUrl){ alert('Apps Script URL을 입력해주세요'); return; }

  var params = { action: 'searchPermit' };

  if(currentMode === 'addr') {
    params.sigunguCd = document.getElementById('sigunguCd').value.trim();
    params.bjdongCd  = document.getElementById('bjdongCd').value.trim();
    params.bun       = document.getElementById('bun').value.trim().padStart(4,'0');
    params.ji        = document.getElementById('ji').value.trim().padStart(4,'0');
    if(!params.sigunguCd){ alert('시군구코드를 입력해주세요'); return; }
  } else {
    params.bldNm = document.getElementById('bldNm').value.trim();
    params.siNm  = document.getElementById('siNm').value.trim();
    params.sggNm = document.getElementById('sggNm').value.trim();
    if(!params.bldNm){ alert('건물명을 입력해주세요'); return; }
  }

  var qs = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  var url = apiUrl + (apiUrl.includes('?') ? '&' : '?') + qs + '&callback=cb';

  document.getElementById('searchBtn').textContent = '조회 중...';
  document.getElementById('rawOutput').textContent = '조회 중...';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('selectedCard').style.display = 'none';

  window.cb = function(d) {
    document.getElementById('searchBtn').textContent = '🔍 조회하기';
    document.getElementById('rawOutput').textContent = JSON.stringify(d, null, 2);
    if(d && d.ok && d.data) {
      parseResult(d.data);
    } else {
      document.getElementById('resultCard').style.display = '';
      document.getElementById('resultList').innerHTML = '<p style="color:#c00;padding:8px">오류: '+(d&&d.error||'알 수 없는 오류')+'</p>';
    }
  };

  var s = document.createElement('script');
  s.src = url;
  s.onerror = function(){
    document.getElementById('searchBtn').textContent = '🔍 조회하기';
    document.getElementById('rawOutput').textContent = '스크립트 로드 실패 — URL 확인 필요';
  };
  document.body.appendChild(s);
  setTimeout(function(){ document.body.removeChild(s); }, 5000);
}

function parseResult(data) {
  var items = [];
  try {
    var body = data.response.body;
    var total = body.totalCount;
    document.getElementById('resultCount').textContent = '총 '+total+'건';
    if(total === 0 || !body.items || !body.items.item) {
      document.getElementById('resultCard').style.display = '';
      document.getElementById('resultList').innerHTML = '<p style="color:#999;padding:12px 0;font-size:12px">결과가 없습니다. 검색어를 바꿔보세요.</p>';
      return;
    }
    items = Array.isArray(body.items.item) ? body.items.item : [body.items.item];
  } catch(e) {
    document.getElementById('resultCard').style.display = '';
    document.getElementById('resultList').innerHTML = '<p style="color:#c00">파싱 오류: '+e.message+'</p>';
    return;
  }

  var html = items.map(function(item, i) {
    return '<div class="result-item" onclick="selectItem('+i+')">'
      +'<h4>'+(item.bldNm||'(건물명 없음)')+' <span style="font-size:10px;color:#999;font-weight:400">'+(item.platPlc||item.newPlatPlc||'')+'</span></h4>'
      +'<p>'
      +'허가접수: <b>'+(item.rcvDay||'-')+'</b> &nbsp;|&nbsp; '
      +'허가완료: <b>'+(item.pmsDay||'-')+'</b> &nbsp;|&nbsp; '
      +'건축주: <b>'+(item.ownerNm||'-')+'</b> &nbsp;|&nbsp; '
      +'용도: '+(item.mainPurpsCdNm||'-')
      +'</p>'
      +'</div>';
  }).join('');

  document.getElementById('resultList').innerHTML = html;
  document.getElementById('resultCard').style.display = '';
  window._items = items;
}

function selectItem(i) {
  var item = window._items[i];
  var ug = parseInt(item.ugrndFlrCnt)||0;
  var gr = parseInt(item.grndFlrCnt)||0;
  var floor = (ug>0?'지하'+ug+'층 ':'') + (gr>0?'지상'+gr+'층':'');

  var mapped = {
    '허가접수일': item.rcvDay||'',
    '허가완료일': item.pmsDay||'',
    '연면적(㎡)': item.totArea||'',
    '대지면적(㎡)': item.platArea||'',
    '층수': floor,
    '주용도': item.mainPurpsCdNm||'',
    '건축주명': item.ownerNm||''
  };

  var html = Object.keys(mapped).map(function(k){
    return '<div class="field-row"><label>'+k+'</label><span>'+(mapped[k]||'<span style="color:#bbb">없음</span>')+'</span></div>';
  }).join('');

  document.getElementById('selectedFields').innerHTML = html;
  document.getElementById('selectedCard').style.display = '';
  document.getElementById('selectedCard').scrollIntoView({behavior:'smooth'});

  window._selected = item;
}
</script>
</body>
</html>
